<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>


    <div class="bg-success d-flex justify-content-between align-items-center p-3">
        <h1 class="text-white m-0 text-center">Home Page</h1>
    </div>

    <div>
        <div class="row">
            <div class="col-5">
                <form class="card container mt-5 p-4" style="max-width:700px;">
                    <h1 class="text-center mb-4">Loan Application Form</h1>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="txtFullName">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">PAN Card</label>
                        <input type="text" class="form-control" id="txtPancard">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="txtDOB">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="txtEmail">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="number" class="form-control" id="txtNumber">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="txtAddress">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input type="text" class="form-control" id="txtCity">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">State</label>
                        <input type="text" class="form-control" id="txtState">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ZIP Code</label>
                        <input type="number" class="form-control" id="txtZIPcode">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Annual Income</label>
                        <input type="number" class="form-control" id="txtAnnualincome">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Employment Status</label>
                        <select class="form-select" id="txtEmploymentstatus">
                            <option value="">Select</option>
                            <option>Employed</option>
                            <option>Self Employed</option>
                            <option>Business Owner</option>
                            <option>Government Employee</option>
                            <option>Student</option>
                            <option>Retired</option>
                            <option>Unemployed</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Credit Score</label>
                        <input type="number" class="form-control" id="txtCreditscore">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Assets</label>
                        <input type="text" class="form-control" id="txtAssets">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Loan Amount</label>
                        <input type="number" class="form-control" id="txtLoanamount">
                    </div>



                    <div class="mb-3">
                        <label class="form-label">Employee Assigned</label>

                        <select class="form-select" id="txtEmployeeAssigned">
                            <option value="">Select Employee</option>
                        </select>
                    </div>
                </form>

            </div>
            <div class="col-7 mt-5">
                <button type="button" class="bg-success" onclick="loadApplicationTable()">Load Your Application
                    table</button><br><br>
                <table class="table table-dark table-striped-columns" id="tblApplication">

                </table>




            </div>


        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="app.js"></script>
</body>

</html>
